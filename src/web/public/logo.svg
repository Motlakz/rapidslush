<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- the shack's sunset sky (lib/art.ts SKIES[2]) -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B3F9A"/>
      <stop offset=".55" stop-color="#F05E8A"/>
      <stop offset="1" stop-color="#FFAF64"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE36E"/>
      <stop offset=".62" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <!-- the game's plastic cup, tapered 30:44 like CUP in lib/art.ts -->
    <clipPath id="cup"><path d="M159 186 L190 444 Q192 460 208 460 L304 460 Q320 460 322 444 L353 186 Z"/></clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="256" cy="250" r="190" fill="url(#sun)" opacity=".9"/>
  <g transform="translate(256 262) scale(.88) translate(-256 -250)">

  <!-- speed streaks: rapid -->
  <g stroke="#FFF9F1" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M54 250 H120" stroke-width="16"/>
    <path d="M78 310 H138" stroke-width="16"/>
    <path d="M40 370 H128" stroke-width="16"/>
  </g>

  <!-- straw -->
  <path d="M262 150 L338 34" stroke="#17152A" stroke-width="34" stroke-linecap="round"/>
  <path d="M262 150 L338 34" stroke="#FF6B8A" stroke-width="20" stroke-linecap="round"/>
  <path d="M276 128 L300 92 M312 73 L330 46" stroke="#FFF9F1" stroke-width="20"/>

  <!-- slush dome -->
  <path d="M146 196 C140 136 196 104 236 118 C256 92 306 96 322 128 C362 128 380 170 366 196 Z" fill="#17152A" stroke="#17152A" stroke-width="20" stroke-linejoin="round"/>
  <path d="M146 196 C140 136 196 104 236 118 C256 92 306 96 322 128 C362 128 380 170 366 196 Z" fill="#FFC857"/>
  <path d="M152 196 C152 162 186 146 214 152 C232 132 276 136 290 158 C320 152 352 170 360 196 Z" fill="#FF6B8A"/>
  <path d="M188 140 C202 124 222 122 236 130" stroke="#FFEBBE" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M296 136 C312 136 328 144 334 156" stroke="#FFEBBE" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- cup body: outline, layered flavours, gloss -->
  <path d="M159 186 L190 444 Q192 460 208 460 L304 460 Q320 460 322 444 L353 186 Z" fill="#17152A" stroke="#17152A" stroke-width="24" stroke-linejoin="round"/>
  <g clip-path="url(#cup)">
    <rect x="140" y="180" width="240" height="290" fill="#FF6B8A"/>
    <path d="M140 278 C190 258 222 296 256 280 C292 262 324 298 380 276 V470 H140 Z" fill="#A78BFA"/>
    <path d="M140 366 C186 348 224 384 260 368 C296 352 330 384 380 364 V470 H140 Z" fill="#45C6F2"/>
    <path d="M140 278 C190 258 222 296 256 280 C292 262 324 298 380 276" stroke="#DED4FE" stroke-width="7" fill="none" opacity=".8"/>
    <path d="M140 366 C186 348 224 384 260 368 C296 352 330 384 380 364" stroke="#C4EDFC" stroke-width="7" fill="none" opacity=".8"/>
    <rect x="140" y="180" width="240" height="290" fill="url(#gloss)"/>
  </g>
  <!-- rim -->
  <rect x="142" y="172" width="228" height="30" rx="15" fill="#FFF9F1" stroke="#17152A" stroke-width="12"/>

  <!-- cherry -->
  <path d="M296 92 C292 74 280 60 262 54" stroke="#17152A" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M296 92 C292 74 280 60 262 54" stroke="#6E9F2B" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="296" cy="114" r="26" fill="#D93D63" stroke="#17152A" stroke-width="10"/>
  <circle cx="287" cy="105" r="7" fill="#FFC2CF"/>
  </g>
</svg>
